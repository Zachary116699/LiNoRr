plugins { id 'com.android.application' }

android {
    namespace 'com.lnreader.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lnreader.app'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.9.16'
        testInstrumentationRunner 'com.lnreader.app.StorageChecks'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Keep the browser interaction prototype in the repository, outside the APK.
    sourceSets.main.assets.srcDirs = []
}
